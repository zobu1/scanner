<!-- stocks/templates/stocks/stock_confirm_delete.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Delete Stock</title>
</head>
<body>
    <h1>Delete Stock</h1>
    <p>Are you sure you want to delete "{{ object.ticker }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
    </form>
    <a href="{% url 'stock_list' %}">Cancel</a>
</body>
</html>
